<style>
:root{--navy:#0D2344;--gold:#D8B24A;--ink:#17233A;--border:#E1E3E8;--rainbow:linear-gradient(90deg,#E43C2F,#F3792B,#F0C92B,#52A852,#149B96,#2C76C1,#5949B6,#B03D87)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#fff}
body{margin:0;background:#fff;color:var(--ink);font-family:'Source Serif 4',Georgia,serif;min-height:100dvh}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:var(--rainbow);z-index:999}
#topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.975);border-bottom:1px solid #ECEDEF;box-shadow:0 5px 18px rgba(13,35,68,.045);backdrop-filter:blur(12px);padding-top:4px}

#book-title{display:flex;align-items:center;gap:8px;font-family:'Playfair Display',serif;font-weight:800;letter-spacing:.11em;color:var(--navy);font-size:.84rem}
#book-title img{width:29px;height:29px;object-fit:contain} #book-title small{font-family:'Inter',sans-serif;color:var(--gold);font-size:.56rem;letter-spacing:.16em;margin-left:4px}
#searchbar-row{max-width:760px;margin:0 auto;padding:8px 14px 10px} #searchbar-wrap{position:relative}
#searchbar-wrap::before{content:"⌕";position:absolute;left:18px;top:50%;transform:translateY(-52%);font-family:Georgia,serif;font-size:1.7rem;color:var(--navy);pointer-events:none;z-index:2}
#search-input{width:100%;height:66px;border:2px solid #D7DAE1;border-radius:20px;background:#fff;color:var(--navy);font-family:'Inter',sans-serif;font-size:1.07rem;font-weight:600;padding:0 46px 0 52px;outline:none;box-shadow:0 7px 22px rgba(13,35,68,.065)}
#search-input::placeholder{color:#8A909B;font-weight:500} #search-input:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(13,35,68,.075),0 8px 24px rgba(13,35,68,.07)}
#search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:#F1F2F5;color:#6C7380;font-size:1.15rem;display:none;cursor:pointer}
#search-results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid #DFE2E8;border-radius:16px;box-shadow:0 16px 34px rgba(13,35,68,.14);overflow:hidden;max-height:55vh;overflow-y:auto;display:none;z-index:200}
#search-results.show{display:block} .sr-item{width:100%;border:0;border-bottom:1px solid #ECEEF2;background:#fff;padding:13px 15px;text-align:left;cursor:pointer;display:grid;gap:2px}
.sr-tab{font-family:'Inter',sans-serif;font-size:.61rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)} .sr-label{font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);font-size:.94rem} .sr-meta{font-family:'Inter',sans-serif;font-size:.72rem;color:#777E89} .sr-empty{padding:18px;text-align:center;font-family:'Inter',sans-serif;color:#858B94;font-size:.82rem}
#topbar-inner{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:0 14px 11px;scrollbar-width:none} #topbar-inner::-webkit-scrollbar{display:none}
.nbtn{--tab:#0D2344;--tabsoft:#F3F5F8;flex:0 0 auto;border:1px solid #DADDE4;border-radius:999px;background:#fff;color:#4E596D;font-family:'Inter',sans-serif;font-size:.72rem;font-weight:800;padding:9px 13px;line-height:1;cursor:pointer}
.nbtn.on{background:var(--tabsoft);border-color:color-mix(in srgb,var(--tab) 42%,white);color:var(--tab)}
#page{max-width:760px;margin:0 auto;padding:22px 14px 72px} .section{display:none;animation:fadein .2s ease} .section.active{display:block} @keyframes fadein{from{opacity:.15;transform:translateY(5px)}to{opacity:1;transform:none}}
.qgrid{display:grid;grid-template-columns:1fr;gap:14px;max-width:620px;margin:0 auto}
.qcard{--accent:#0D2344;--soft:#F5F6F8;position:relative;width:100%;min-height:98px;border:1px solid color-mix(in srgb,var(--accent) 24%,white);border-radius:18px;background:var(--soft);padding:18px 62px 18px 18px;display:grid;grid-template-columns:54px 1fr;align-items:center;gap:10px;text-align:left;cursor:pointer;box-shadow:0 4px 12px rgba(13,35,68,.03);overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)} .qnum{font-family:'Inter',sans-serif;font-size:.78rem;font-weight:900;color:var(--accent)} .qname{font-family:'Playfair Display',serif;font-size:1.22rem;font-weight:800;color:var(--navy)} .qarrow{position:absolute;right:19px;top:50%;transform:translateY(-50%);color:var(--accent);font-family:'Inter',sans-serif;font-size:1.35rem}
.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:3px 1px 18px} .ptag{display:inline-block;font-family:'Inter',sans-serif;font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--section);border-bottom:1px solid color-mix(in srgb,var(--section) 55%,white);padding-bottom:5px;margin-bottom:9px}
h1{margin:0;font-family:'Playfair Display',serif;font-size:clamp(1.85rem,8vw,2.5rem);line-height:1.03;color:var(--navy)} .upload-btn{flex:0 0 auto;text-decoration:none;font-family:'Inter',sans-serif;font-size:.72rem;font-weight:900;padding:10px 12px;border-radius:12px;background:var(--sectionsoft);color:var(--section);border:1px solid color-mix(in srgb,var(--section) 32%,white)}
.asset-grid{display:grid;grid-template-columns:1fr;gap:13px;max-width:620px;margin:0 auto} .asset-card{border:1px solid #E1E4E9;border-radius:17px;background:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(13,35,68,.045)}
.canva-preview{min-height:112px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px;background:linear-gradient(135deg,var(--sectionsoft),#fff);text-decoration:none} .canva-mark{width:58px;height:58px;border-radius:18px;background:var(--section);display:grid;place-items:center;color:#fff;font-family:'Inter',sans-serif;font-weight:900;font-size:.67rem;letter-spacing:.08em;box-shadow:0 7px 16px color-mix(in srgb,var(--section) 22%,transparent)} .canva-pages{font-family:'Inter',sans-serif;font-size:.72rem;font-weight:800;color:var(--section)}
.file-preview{min-height:120px;display:grid;place-items:center;background:linear-gradient(145deg,#FAFAFB,#F1F2F5);padding:20px;text-decoration:none} .file-badge{display:grid;place-items:center;width:70px;height:82px;border-radius:10px;background:#fff;border:1px solid #DBDEE5;font-family:'Inter',sans-serif;font-weight:900;color:var(--section);font-size:.76rem}
.asset-info{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px} .asset-copy{min-width:0;display:grid;gap:3px} .asset-copy strong{font-family:'Playfair Display',serif;color:var(--navy);font-size:1rem;line-height:1.2;word-break:break-word} .file-type{font-family:'Inter',sans-serif;font-size:.58rem;font-weight:900;letter-spacing:.12em;color:var(--section);text-transform:uppercase}
.asset-actions{display:flex;gap:7px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end} .open-btn,.grab-btn{border:1px solid color-mix(in srgb,var(--section) 32%,white);border-radius:10px;background:var(--sectionsoft);color:var(--section);font-family:'Inter',sans-serif;font-size:.68rem;font-weight:900;padding:9px 10px;text-decoration:none;cursor:pointer} .grab-btn{background:var(--section);border-color:var(--section);color:#fff}
.empty-state{display:none;margin:4px auto 0;max-width:620px;border:1px dashed #D8DBE2;border-radius:15px;padding:25px;text-align:center;font-family:'Inter',sans-serif;font-size:.78rem;font-weight:700;color:#8A9099;background:#FCFCFD}
@media(max-width:420px){#brandbar{padding-top:8px}#searchbar-row,#topbar-inner,#page{padding-left:11px;padding-right:11px}#search-input{height:64px;font-size:1rem}.asset-info{align-items:flex-end}.asset-actions{flex-direction:column}}
</style>
</head>

<script>
const GH_OWNER='globologia',GH_REPO='globologia-hq',GH_BRANCH='main';
const SECTION_NAMES={"libro": "El Libro", "impresion": "Impresión", "legal": "Legal", "marca": "Marca & Lorenita", "marketing": "Marketing", "redes": "Redes & Plataformas"};
const SECTION_COLORS={"libro": "#E44B31", "impresion": "#C79612", "legal": "#6946A5", "marca": "#C7447B", "marketing": "#319656", "redes": "#168B91"};
const SECTION_SOFT={"libro": "#FFF1ED", "impresion": "#FFF8DF", "legal": "#F5F0FF", "marca": "#FFF0F7", "marketing": "#EEF9F1", "redes": "#ECFAFA"};
const CANVA_ASSETS=[{"section": "libro", "title": "GLOBOLOGIA 4000A", "pages": 23, "view": "https://www.canva.com/d/T7rwmfi5nO-7GT3", "edit": "https://www.canva.com/d/Ga3L6KG2z43w7rB"}, {"section": "libro", "title": "globologia spreads", "pages": 16, "view": "https://www.canva.com/d/XNAjH8H_WztQoZk", "edit": "https://www.canva.com/d/V66_t4u_ZysBq-g"}, {"section": "libro", "title": "globologia 3000 spreads", "pages": 60, "view": "https://www.canva.com/d/pYWPGgrPZnjr9U2", "edit": "https://www.canva.com/d/cuCoz5F2bC5iKKC"}, {"section": "libro", "title": "globologia 3000.pdf", "pages": 35, "view": "https://www.canva.com/d/fm-dj0Zj15tTBiw", "edit": "https://www.canva.com/d/GhLB4kCo2HqNOkG"}, {"section": "libro", "title": "globologia 3000 COPY/TEXT only", "pages": 29, "view": "https://www.canva.com/d/iAj4NkmZpu4iw7g", "edit": "https://www.canva.com/d/emm6j4lwQshpM66"}, {"section": "libro", "title": "GLOBOLOGIA 2000", "pages": 55, "view": "https://www.canva.com/d/krz6h9DRwyWh3mE", "edit": "https://www.canva.com/d/zBrSeDfWf-W75M2"}, {"section": "libro", "title": "GLOBOLOGÍA 1000", "pages": 44, "view": "https://www.canva.com/d/70uhRar1EuXWjIZ", "edit": "https://www.canva.com/d/bmQSe30-w3XnSoR"}, {"section": "libro", "title": "Globologia 200", "pages": 17, "view": "https://www.canva.com/d/1h0aXkMtPaxB28t", "edit": "https://www.canva.com/d/RkPrF2ML8CVuO3P"}, {"section": "libro", "title": "GLOBOLOGIA 1000 — Presentation (4:3)", "pages": 57, "view": "https://www.canva.com/d/R5NtM82cmTE4o2e", "edit": "https://www.canva.com/d/LENPNWeFhQy_67Y"}, {"section": "libro", "title": "GLOBOLOGIA 1000 — 11 x 8.5 in", "pages": 57, "view": "https://www.canva.com/d/PEw8TTTA4Am-ww5", "edit": "https://www.canva.com/d/JoKUBQcGDq1_KQt"}, {"section": "legal", "title": "globologia_copyright_page.pdf", "pages": 1, "view": "https://www.canva.com/d/-bfUw8lGEUbUCJR", "edit": "https://www.canva.com/d/6qmVPZvHjh1Amxy"}, {"section": "legal", "title": "globologia_copyright_page_compact.pdf", "pages": 1, "view": "https://www.canva.com/d/SvTrgiM-4CUk2t8", "edit": "https://www.canva.com/d/07Vegto8lXfxtKa"}, {"section": "marca", "title": "logo's de globologia", "pages": 9, "view": "https://www.canva.com/d/XGE4zQE9kJulr7Z", "edit": "https://www.canva.com/d/J7AJzTfW-jT4Wmg"}, {"section": "marca", "title": "Globologia Banner Logos", "pages": 6, "view": "https://www.canva.com/d/1KxsL_iD-CgpEPw", "edit": "https://www.canva.com/d/qOuwRK20cMk3Ujp"}, {"section": "marca", "title": "🎈 Globología Visual System", "pages": 1, "view": "https://www.canva.com/d/3SRtnAjY9_AlCSO", "edit": "https://www.canva.com/d/1090ChAnk0aA5JX"}, {"section": "marca", "title": "Lorenita AKA Nina", "pages": 3, "view": "https://www.canva.com/d/F-c9-4yM8NhsRbZ", "edit": "https://www.canva.com/d/_Hm25r2LiXGp0mr"}, {"section": "marca", "title": "nina lorenita logo with cloud", "pages": 3, "view": "https://www.canva.com/d/gAte6utueECBKW-", "edit": "https://www.canva.com/d/Fc2ILgqDf-_W2b0"}, {"section": "marketing", "title": "portadas y mockups para globologia", "pages": 11, "view": "https://www.canva.com/d/evRmHlm-eTX1DYU", "edit": "https://www.canva.com/d/x0nCm_8PB2WiIIi"}, {"section": "redes", "title": "ADVERTISEMENTS FOR SOCIAL MEDIA FOR GLOBOLOGIA", "pages": 13, "view": "https://www.canva.com/d/tCS5odz1LiwClKN", "edit": "https://www.canva.com/d/cvYhcVct0YmeTmP"}, {"section": "redes", "title": "GLOBOLOGIA SOCIAL MEDIA ASSETS", "pages": 16, "view": "https://www.canva.com/d/4fWHxfJeAyCacNU", "edit": "https://www.canva.com/d/GorLtETf0CugPrP"}];
let remoteAssets=[];
function go(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('on'));const sec=document.getElementById('s-'+id);if(sec)sec.classList.add('active');const target=btn||document.querySelector('.nbtn[data-tab="'+id+'"]');if(target)target.classList.add('on');history.replaceState(null,'',id==='inicio'?location.pathname:'#'+id);window.scrollTo({top:0,behavior:'smooth'});updateEmptyStates();}
function jumpTo(id){go(id);closeSearch();}
function normalize(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);}
function extFromPath(path){const m=path.match(/\.([^.\/]+)$/);return m?m[1].toLowerCase():'file';}
function displayNameFromPath(path){return path.split('/').pop().replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();}
function rawUrl(path){return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${encodeURI(path)}`;}
function githubViewUrl(path){return `https://github.com/${GH_OWNER}/${GH_REPO}/blob/${GH_BRANCH}/${encodeURI(path)}`;}
function isImage(ext){return ['png','jpg','jpeg','webp','gif','svg','avif'].includes(ext);}
function searchItems(){ const secs=Object.keys(SECTION_NAMES).map(section=>({section,label:SECTION_NAMES[section],type:'Sección'})); const c=CANVA_ASSETS.map(a=>({section:a.section,label:a.title,type:'Canva'})); const r=remoteAssets.map(a=>({section:a.section,label:a.displayName,type:a.ext.toUpperCase()})); return secs.concat(c,r);}
function doSearch(query){const q=normalize(query.trim()),box=document.getElementById('search-results');document.getElementById('search-clear').style.display=q?'block':'none';if(!q){closeSearch();return;}const matches=searchItems().filter(x=>normalize(x.label+' '+x.type+' '+SECTION_NAMES[x.section]).includes(q)).slice(0,30);box.innerHTML=matches.length?matches.map(m=>`<button class="sr-item" onclick="jumpTo('${m.section}')" style="--accent:${SECTION_COLORS[m.section]}"><span class="sr-tab">${SECTION_NAMES[m.section]}</span><span class="sr-label">${escapeHtml(m.label)}</span><span class="sr-meta">${escapeHtml(m.type)}</span></button>`).join(''):'<div class="sr-empty">Sin resultados</div>';box.classList.add('show');}
function clearSearch(){const i=document.getElementById('search-input');i.value='';i.focus();document.getElementById('search-clear').style.display='none';closeSearch();}
function closeSearch(){const b=document.getElementById('search-results');b.classList.remove('show');b.innerHTML='';}
document.addEventListener('click',e=>{const w=document.getElementById('searchbar-wrap');if(w&&!w.contains(e.target))closeSearch();});
function renderCanvaAssets(){ CANVA_ASSETS.forEach(a=>{const grid=document.getElementById('assets-'+a.section);if(!grid)return;const card=document.createElement('article');card.className='asset-card canva-asset';card.style.setProperty('--section',SECTION_COLORS[a.section]);card.style.setProperty('--sectionsoft',SECTION_SOFT[a.section]);card.innerHTML=`<a class="canva-preview" href="${a.view}" target="_blank" rel="noopener"><span class="canva-mark">CANVA</span><span class="canva-pages">${a.pages} pág${a.pages===1?'':'s'}</span></a><div class="asset-info"><div class="asset-copy"><span class="file-type">CANVA</span><strong>${escapeHtml(a.title)}</strong></div><div class="asset-actions"><a class="open-btn" href="${a.view}" target="_blank" rel="noopener">Abrir</a><a class="grab-btn" href="${a.edit}" target="_blank" rel="noopener">Editar</a></div></div>`;grid.appendChild(card);}); }
async function loadGithubAssets(){ try{const r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/git/trees/${GH_BRANCH}?recursive=1`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw new Error();const data=await r.json();remoteAssets=(data.tree||[]).filter(x=>x.type==='blob'&&x.path.startsWith('assets/')).filter(x=>!/(^|\/)\.gitkeep$|(^|\/)README/i.test(x.path)).map(x=>{const p=x.path.split('/'),section=p[1];if(!SECTION_NAMES[section])return null;return{section,path:x.path,ext:extFromPath(x.path),displayName:displayNameFromPath(x.path)};}).filter(Boolean);renderRemoteAssets();}catch(e){updateEmptyStates();} }
function renderRemoteAssets(){document.querySelectorAll('.remote-asset').forEach(e=>e.remove());remoteAssets.forEach(a=>{const grid=document.getElementById('assets-'+a.section);if(!grid)return;const url=rawUrl(a.path),view=githubViewUrl(a.path),card=document.createElement('article');card.className='asset-card remote-asset';card.style.setProperty('--section',SECTION_COLORS[a.section]);card.style.setProperty('--sectionsoft',SECTION_SOFT[a.section]);const preview=isImage(a.ext)?`<a class="file-preview" href="${url}" target="_blank"><span class="file-badge">IMG</span></a>`:`<a class="file-preview" href="${view}" target="_blank"><span class="file-badge">${escapeHtml(a.ext.toUpperCase())}</span></a>`;card.innerHTML=`${preview}<div class="asset-info"><div class="asset-copy"><span class="file-type">${escapeHtml(a.ext.toUpperCase())}</span><strong>${escapeHtml(a.displayName)}</strong></div><div class="asset-actions"><a class="open-btn" href="${view}" target="_blank">Abrir</a><button class="grab-btn" onclick="downloadRemoteAsset('${url.replace(/'/g,"\\'")}','${a.path.split('/').pop().replace(/'/g,"\\'")}')">Descargar</button></div></div>`;grid.appendChild(card);});updateEmptyStates();}
async function downloadRemoteAsset(url,filename){try{const r=await fetch(url);const b=await r.blob();const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}catch(e){window.open(url,'_blank');}}
function updateEmptyStates(){Object.keys(SECTION_NAMES).forEach(id=>{const g=document.getElementById('assets-'+id),e=document.getElementById('empty-'+id);if(!g||!e)return;const n=g.querySelectorAll('.asset-card').length;e.style.display=n?'none':'block';});}
window.addEventListener('load',()=>{renderCanvaAssets();const h=location.hash.replace('#','');go(h&&SECTION_NAMES[h]?h:'inicio');loadGithubAssets();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});});
</script>
</body>
